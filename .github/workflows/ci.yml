# Checks every push and pull request: lint and the tests (offline: the model is faked), the web app (types, tests,
# build), that the family kit's copy in web/public/family/ is the version this site was last synced to, that the
# server image builds and the site starts inside it on the sample data, and every page for accessibility problems
# (scripts/a11y.mjs).
#
# The jobs that are the same on every Where They Stand site are the shared workflows of wts-core, called at the tag
# of the package this site installs (pyproject.toml): the two are raised together, by hand, in one change
# (wts-core docs/adr/0010; tests/test_dependencies.py checks they agree, and Dependabot is told to leave them).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # uv sync --frozen, ruff, pytest, with the family's Python and uv
  python:
    uses: rj-mitchell/wts-core/.github/workflows/python.yml@v0.4.0
    with:
      lint-paths: "src tests scripts"

  # npm ci, the type check, the tests and the build, with the family's Node
  web:
    uses: rj-mitchell/wts-core/.github/workflows/web.yml@v0.4.0
    with:
      working-directory: web

  # The Where They Stand family kit version last synced into web/public/family/. Raise it in the same change as a
  # new sync.
  kit:
    uses: rj-mitchell/wts-core/.github/workflows/kit.yml@v0.4.0
    with:
      version: "2.3.0"
      site: mps
      path: web/public/family

  # The server image must build, and the site must start inside it (on the offline sample data). This job is the
  # site's own: it starts the image as the server does and reads its pages, which the shared Docker workflow
  # (build, and one command) does not.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: wheretheystand:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the site on the sample data
        run: |
          docker run -d --name wts -p 8000:8000 wheretheystand:ci \
            sh -c "hansard bootstrap --sample && exec hansard serve --host 0.0.0.0 --port 8000"
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/api/health && break
            sleep 2
          done
      - name: Check the pages respond
        run: |
          curl -fsS http://localhost:8000/ | grep -q "Where MPs Stand"
          curl -fsS http://localhost:8000/methodology | grep -q "Methodology"
          curl -fsS http://localhost:8000/corrections | grep -q "Report a problem"
          curl -fsS http://localhost:8000/named | grep -q "We reply within 5 working days"
          curl -fsS http://localhost:8000/api/status | grep -q "latest_record"
          curl -fsS -X POST http://localhost:8000/api/search -H "Content-Type: application/json" \
            -d '{"question": "trial by jury"}' | grep -q '"sources"'
      - name: The owner's commands run in the image, and the nightly housekeeping on the sample data
        run: |
          docker exec wts hansard check-settings
          docker exec wts hansard meaning-check
          docker exec wts hansard stats --since 7d
          docker exec wts hansard tidy
          docker exec wts hansard eval replay eval/fixtures
      - name: Accessibility check (axe, WCAG 2.2 AA, light and dark, desktop and phone)
        uses: rj-mitchell/wts-core/.github/actions/a11y@v0.4.0
        with:
          url: http://localhost:8000
      - name: Show the container log if anything failed
        if: failure()
        run: docker logs wts || true
      - name: Stop the site
        if: always()
        run: docker rm -f wts || true
