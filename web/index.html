    <!-- For readers with scripts off. The server removes it from pages that put their own text in the root. -->

          </p>

            Asking a question needs JavaScript, which is off or not available in this browser. These pages work
            without it:
          </p>
          <ul>
            <li><a href="/this-week">In Parliament this week</a>: what was debated, asked and voted on</li>

            <li><a href="/methodology">Methodology</a>: how a briefing is written and checked</li>
            <li><a href="/glossary">Glossary</a>: the words Parliament uses</li>
            <li><a href="/developers">Data and API</a>: the same records, for reuse</li>
            <li><a href="/corrections">Corrections and problems</a>: what has been put right</li>
          </ul>
          <p>Saved briefings, topic briefings and each MP's and peer's page also show their text without JavaScript.</p>
